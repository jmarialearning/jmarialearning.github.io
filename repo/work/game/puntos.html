<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timbiriche</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #202437;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
      text-align: center;
    }

    h1 { margin-bottom: 8px; }
    .instrucciones { margin-top: 0; color: #596078; }

    .marcador {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin: 20px 0 12px;
      font-size: 1.1rem;
    }

    .jugador { padding: 8px 14px; border-radius: 10px; }
    .activo { outline: 3px solid #202437; }
    #p1 { color: #1769aa; }
    #p2 { color: #d14c3f; }

    #estado { min-height: 1.5em; font-weight: 600; }

    .controles {
      margin: 14px 0 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, button {
      font: inherit;
      padding: 8px 12px;
      border: 1px solid #c7ccda;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    #tablero {
      display: block;
      width: min(100%, 620px);
      height: auto;
      margin: 0 auto;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <h1>¡Timbiriche!</h1>
  <p class="instrucciones">
    Une dos puntos vecinos. Quien cierre un cuadrito se lo queda y juega otra vez.
  </p>

  <div class="marcador">
    <div id="p1" class="jugador">🔵 Jugador 1: <span id="score1">0</span></div>
    <div id="p2" class="jugador"><span id="nombreP2">🔴 Jugador 2</span>: <span id="score2">0</span></div>
  </div>

  <div id="estado" aria-live="polite"></div>

  <div class="controles">
    <label for="modo">Modo:</label>
    <select id="modo">
      <option value="maquina">Contra la máquina</option>
      <option value="dos">Dos jugadores</option>
    </select>

    <label for="tamano">Tablero:</label>
    <select id="tamano">
      <option value="4">5 × 5</option>
      <option value="5" selected>6 × 6</option>
      <option value="6">7 × 7</option>
      <option value="7">8 × 8</option>
    </select>

    <button id="reiniciar">Empezar de nuevo</button>
  </div>

  <canvas id="tablero" aria-label="Tablero de timbiriche"></canvas>

  <script>
    const canvas = document.getElementById("tablero");
    const ctx = canvas.getContext("2d");
    const estado = document.getElementById("estado");
    const selectorTamano = document.getElementById("tamano");
    const selectorModo = document.getElementById("modo");

    const colores = ["#1769aa", "#d14c3f"];
    let n, celda, margen, jugador, lineasH, lineasV, cajas, terminado;

    function iniciar() {
      n = Number(selectorTamano.value);
      jugador = 0;
      terminado = false;
      lineasH = Array.from({ length: n + 1 }, () => Array(n).fill(-1));
      lineasV = Array.from({ length: n }, () => Array(n + 1).fill(-1));
      cajas = Array.from({ length: n }, () => Array(n).fill(-1));

      document.getElementById("nombreP2").textContent =
        selectorModo.value === "maquina" ? "🔴 Máquina" : "🔴 Jugador 2";

      estado.textContent = "Turno del Jugador 1.";
      dibujar();
      actualizarMarcador();
    }

    function dibujar() {
      const ancho = Math.min(620, Math.max(300, window.innerWidth - 40));
      const dpr = window.devicePixelRatio || 1;

      canvas.width = ancho * dpr;
      canvas.height = ancho * dpr;
      canvas.style.width = ancho + "px";
      canvas.style.height = ancho + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      margen = ancho * 0.09;
      celda = (ancho - margen * 2) / n;
      ctx.clearRect(0, 0, ancho, ancho);

      // Cuadritos ganados
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          if (cajas[y][x] !== -1) {
            ctx.fillStyle = colores[cajas[y][x]] + "35";
            ctx.fillRect(
              margen + x * celda + 2,
              margen + y * celda + 2,
              celda - 4,
              celda - 4
            );

            ctx.fillStyle = colores[cajas[y][x]];
            ctx.font = `bold ${Math.max(16, celda * 0.45)}px system-ui`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(
              cajas[y][x] === 0 ? "1" : "2",
              margen + (x + 0.5) * celda,
              margen + (y + 0.5) * celda
            );
          }
        }
      }

      ctx.lineCap = "round";
      ctx.lineWidth = Math.max(4, celda * 0.09);

      // Líneas horizontales dibujadas
      for (let y = 0; y <= n; y++) {
        for (let x = 0; x < n; x++) {
          if (lineasH[y][x] !== -1) {
            ctx.strokeStyle = colores[lineasH[y][x]];
            segmento(
              margen + x * celda, margen + y * celda,
              margen + (x + 1) * celda, margen + y * celda
            );
          }
        }
      }

      // Líneas verticales dibujadas
      for (let y = 0; y < n; y++) {
        for (let x = 0; x <= n; x++) {
          if (lineasV[y][x] !== -1) {
            ctx.strokeStyle = colores[lineasV[y][x]];
            segmento(
              margen + x * celda, margen + y * celda,
              margen + x * celda, margen + (y + 1) * celda
            );
          }
        }
      }

      // Puntos
      ctx.fillStyle = "#202437";
      for (let y = 0; y <= n; y++) {
        for (let x = 0; x <= n; x++) {
          ctx.beginPath();
          ctx.arc(
            margen + x * celda,
            margen + y * celda,
            Math.max(4, celda * 0.075),
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      function segmento(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }

    function actualizarMarcador() {
      const puntos = [0, 0];

      for (const fila of cajas) {
        for (const duenio of fila) {
          if (duenio !== -1) puntos[duenio]++;
        }
      }

      document.getElementById("score1").textContent = puntos[0];
      document.getElementById("score2").textContent = puntos[1];
      document.getElementById("p1").classList.toggle(
        "activo", jugador === 0 && !terminado
      );
      document.getElementById("p2").classList.toggle(
        "activo", jugador === 1 && !terminado
      );

      return puntos;
    }

    function cajaCompleta(y, x) {
      return lineasH[y][x] !== -1 &&
        lineasH[y + 1][x] !== -1 &&
        lineasV[y][x] !== -1 &&
        lineasV[y][x + 1] !== -1;
    }

    function aplicarLinea(linea) {
      if (terminado) return;

      if (linea.tipo === "h") {
        if (lineasH[linea.r][linea.c] !== -1) return;
        lineasH[linea.r][linea.c] = jugador;
      } else {
        if (lineasV[linea.r][linea.c] !== -1) return;
        lineasV[linea.r][linea.c] = jugador;
      }

      let cerroCaja = false;

      if (linea.tipo === "h") {
        if (linea.r > 0 && cajaCompleta(linea.r - 1, linea.c)) {
          cajas[linea.r - 1][linea.c] = jugador;
          cerroCaja = true;
        }
        if (linea.r < n && cajaCompleta(linea.r, linea.c)) {
          cajas[linea.r][linea.c] = jugador;
          cerroCaja = true;
        }
      } else {
        if (linea.c > 0 && cajaCompleta(linea.r, linea.c - 1)) {
          cajas[linea.r][linea.c - 1] = jugador;
          cerroCaja = true;
        }
        if (linea.c < n && cajaCompleta(linea.r, linea.c)) {
          cajas[linea.r][linea.c] = jugador;
          cerroCaja = true;
        }
      }

      if (!cerroCaja) jugador = 1 - jugador;

      const puntos = actualizarMarcador();
      const cuadritosGanados = puntos[0] + puntos[1];

      if (cuadritosGanados === n * n) {
        terminado = true;

        if (puntos[0] === puntos[1]) {
          estado.textContent = `¡Empate! ${puntos[0]} a ${puntos[1]}.`;
        } else {
          const ganador = puntos[0] > puntos[1] ? 1 : 2;
          estado.textContent = `¡Ganó ${nombreJugador(ganador - 1)}!`;
        }

        actualizarMarcador();
        dibujar();
        return;
      }

      estado.textContent = cerroCaja
        ? `¡${nombreJugador(jugador)} cerró un cuadrito y juega otra vez!`
        : `Turno de ${nombreJugador(jugador)}.`;

      dibujar();

      if (selectorModo.value === "maquina" && jugador === 1 && !terminado) {
        setTimeout(jugadaMaquina, 500);
      }
    }

    function nombreJugador(indice) {
      if (indice === 0) return "Jugador 1";
      return selectorModo.value === "maquina" ? "la máquina" : "Jugador 2";
    }

    function manejarClic(evento) {
      if (terminado) return;
      if (selectorModo.value === "maquina" && jugador === 1) return;

      const rect = canvas.getBoundingClientRect();
      const x = evento.clientX - rect.left;
      const y = evento.clientY - rect.top;
      const gx = (x - margen) / celda;
      const gy = (y - margen) / celda;
      const opciones = [];

      const ix = Math.floor(gx);
      const iy = Math.floor(gy);

      for (let r = iy - 1; r <= iy + 1; r++) {
        for (let c = ix - 1; c <= ix + 1; c++) {
          if (r >= 0 && r <= n && c >= 0 && c < n && lineasH[r][c] === -1) {
            const distancia = Math.abs(gy - r) +
              Math.max(0, c - gx, gx - (c + 1));
            opciones.push({ tipo: "h", r, c, distancia });
          }

          if (r >= 0 && r < n && c >= 0 && c <= n && lineasV[r][c] === -1) {
            const distancia = Math.abs(gx - c) +
              Math.max(0, r - gy, gy - (r + 1));
            opciones.push({ tipo: "v", r, c, distancia });
          }
        }
      }

      opciones.sort((a, b) => a.distancia - b.distancia);
      const linea = opciones[0];

      if (linea && linea.distancia <= 0.38) {
        aplicarLinea(linea);
      }
    }

    function jugadaMaquina() {
      if (terminado || jugador !== 1 || selectorModo.value !== "maquina") return;

      const disponibles = obtenerLineasDisponibles();

      // Primero intenta completar un cuadrito.
      const paraCerrar = disponibles.filter(linea => cuantasCajasCierra(linea) > 0);
      const linea = paraCerrar.length
        ? paraCerrar[Math.floor(Math.random() * paraCerrar.length)]
        : disponibles[Math.floor(Math.random() * disponibles.length)];

      if (linea) aplicarLinea(linea);
    }

    function obtenerLineasDisponibles() {
      const disponibles = [];

      for (let r = 0; r <= n; r++) {
        for (let c = 0; c < n; c++) {
          if (lineasH[r][c] === -1) disponibles.push({ tipo: "h", r, c });
        }
      }

      for (let r = 0; r < n; r++) {
        for (let c = 0; c <= n; c++) {
          if (lineasV[r][c] === -1) disponibles.push({ tipo: "v", r, c });
        }
      }

      return disponibles;
    }

    function ladosDibujados(y, x) {
      return [
        lineasH[y][x],
        lineasH[y + 1][x],
        lineasV[y][x],
        lineasV[y][x + 1]
      ].filter(lado => lado !== -1).length;
    }

    function cuantasCajasCierra(linea) {
      let total = 0;

      if (linea.tipo === "h") {
        if (linea.r > 0 && ladosDibujados(linea.r - 1, linea.c) === 3) total++;
        if (linea.r < n && ladosDibujados(linea.r, linea.c) === 3) total++;
      } else {
        if (linea.c > 0 && ladosDibujados(linea.r, linea.c - 1) === 3) total++;
        if (linea.c < n && ladosDibujados(linea.r, linea.c) === 3) total++;
      }

      return total;
    }

    canvas.addEventListener("click", manejarClic);
    document.getElementById("reiniciar").addEventListener("click", iniciar);
    selectorTamano.addEventListener("change", iniciar);
    selectorModo.addEventListener("change", iniciar);
    window.addEventListener("resize", dibujar);

    iniciar();
  </script>
</body>
</html>
