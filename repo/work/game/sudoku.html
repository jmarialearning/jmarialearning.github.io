<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    main {
      width: min(100%, 1100px);
      padding: 24px;
      display: grid;
      grid-template-columns: auto 230px;
      gap: 48px;
      align-items: center;
      justify-content: center;
    }

    h1 { margin: 0 0 8px; }
    .instruccion { margin: 0 0 18px; color: #555; }

    #tablero {
      display: grid;
      grid-template-columns: repeat(9, min(6.3vw, 58px));
      grid-template-rows: repeat(9, min(6.3vw, 58px));
      border: 3px solid #222;
    }

    .celda {
      width: 100%;
      height: 100%;
      padding: 0;
      text-align: center;
      font-size: clamp(18px, 3vw, 28px);
      border: 1px solid #aaa;
      background: white;
      color: #222;
      cursor: pointer;
    }

    .celda.fija {
      background: #e5e7eb;
      font-weight: bold;
    }

    .celda.seleccionada { background: #bfdbfe; }
    .celda.error { background: #fecaca; color: #991b1b; }

    .celda:nth-child(3n) { border-right: 2px solid #555; }

    .celda:nth-child(n + 19):nth-child(-n + 27),
    .celda:nth-child(n + 46):nth-child(-n + 54) {
      border-bottom: 2px solid #555;
    }

    #teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    button.accion, #teclado button {
      border: 1px solid #aaa;
      border-radius: 8px;
      background: white;
      padding: 14px;
      font-size: 22px;
      cursor: pointer;
    }

    #teclado button:hover, button.accion:hover {
      background: #e5e7eb;
    }

    button.accion {
      width: 100%;
      margin-top: 8px;
      font-size: 16px;
    }

    #mensaje { min-height: 1.5em; }

    @media (max-width: 650px) {
      main {
        grid-template-columns: 1fr;
        gap: 20px;
        justify-items: center;
      }

      #tablero {
        grid-template-columns: repeat(9, min(10vw, 42px));
        grid-template-rows: repeat(9, min(10vw, 42px));
      }

      .panel { width: min(100%, 300px); }
    }
  </style>
</head>

<body>
  <main>
    <section>
      <h1>Sudoku</h1>
      <p class="instruccion">Selecciona una casilla vacía y elige un número.</p>
      <div id="tablero" aria-label="Tablero de Sudoku"></div>
    </section>

    <section class="panel">
      <h2>Teclado</h2>
      <div id="teclado" aria-label="Teclado numérico"></div>

      <button class="accion" id="borrar">⌫ Borrar número</button>
      <button class="accion" id="comprobar">Comprobar</button>
      <button class="accion" id="reiniciar">Reiniciar tablero</button>
      <button class="accion" id="nuevo">Nuevo Sudoku</button>

      <p id="mensaje" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const tableroElemento = document.getElementById("tablero");
    const mensaje = document.getElementById("mensaje");

    let puzzle = [];
    let solucion = [];
    let seleccionada = null;

    function mezclar(array) {
      const copia = [...array];

      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }

      return copia;
    }

    function esValido(tablero, fila, columna, numero) {
      for (let i = 0; i < 9; i++) {
        if (tablero[fila][i] === numero) return false;
        if (tablero[i][columna] === numero) return false;
      }

      const inicioFila = Math.floor(fila / 3) * 3;
      const inicioColumna = Math.floor(columna / 3) * 3;

      for (let f = inicioFila; f < inicioFila + 3; f++) {
        for (let c = inicioColumna; c < inicioColumna + 3; c++) {
          if (tablero[f][c] === numero) return false;
        }
      }

      return true;
    }

    function rellenarTablero(tablero) {
      for (let fila = 0; fila < 9; fila++) {
        for (let columna = 0; columna < 9; columna++) {
          if (tablero[fila][columna] === 0) {
            for (const numero of mezclar([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
              if (esValido(tablero, fila, columna, numero)) {
                tablero[fila][columna] = numero;

                if (rellenarTablero(tablero)) return true;

                tablero[fila][columna] = 0;
              }
            }
            return false;
          }
        }
      }

      return true;
    }

    function generarSudoku() {
      solucion = Array.from({ length: 9 }, () => Array(9).fill(0));
      rellenarTablero(solucion);

      puzzle = solucion.map(fila => [...fila]);

      // Se quitan 42 números para crear las casillas vacías.
      const posiciones = mezclar(
        Array.from({ length: 81 }, (_, indice) => indice)
      );

      for (let i = 0; i < 42; i++) {
        const indice = posiciones[i];
        const fila = Math.floor(indice / 9);
        const columna = indice % 9;
        puzzle[fila][columna] = 0;
      }

      crearTablero();
      mensaje.textContent = "¡Sudoku nuevo generado!";
    }

    function crearTablero() {
      tableroElemento.innerHTML = "";
      seleccionada = null;

      puzzle.forEach((fila, r) => {
        fila.forEach((numero, c) => {
          const celda = document.createElement("button");
          celda.className = "celda";
          celda.type = "button";
          celda.dataset.fila = r;
          celda.dataset.columna = c;
          celda.setAttribute("aria-label", `Fila ${r + 1}, columna ${c + 1}`);

          if (numero !== 0) {
            celda.textContent = numero;
            celda.classList.add("fija");
          } else {
            celda.addEventListener("click", () => seleccionar(celda));
          }

          tableroElemento.appendChild(celda);
        });
      });
    }

    function seleccionar(celda) {
      document.querySelectorAll(".celda").forEach(c =>
        c.classList.remove("seleccionada")
      );

      seleccionada = celda;
      celda.classList.add("seleccionada");
    }

    function obtenerNumero(celda) {
      return Number(celda.textContent) || 0;
    }

    function hayConflicto(celda, celdas) {
      const fila = Number(celda.dataset.fila);
      const columna = Number(celda.dataset.columna);
      const numero = obtenerNumero(celda);

      if (!numero) return false;

      return celdas.some(otra => {
        if (otra === celda || obtenerNumero(otra) !== numero) return false;

        const otraFila = Number(otra.dataset.fila);
        const otraColumna = Number(otra.dataset.columna);

        return (
          otraFila === fila ||
          otraColumna === columna ||
          (
            Math.floor(otraFila / 3) === Math.floor(fila / 3) &&
            Math.floor(otraColumna / 3) === Math.floor(columna / 3)
          )
        );
      });
    }

    function actualizarConflictos() {
      const celdas = [...document.querySelectorAll(".celda")];

      celdas.forEach(celda => celda.classList.remove("error"));

      let hayErrores = false;

      celdas.forEach(celda => {
        if (hayConflicto(celda, celdas)) {
          celda.classList.add("error");
          hayErrores = true;
        }
      });

      return hayErrores;
    }

    function ponerNumero(numero) {
      if (!seleccionada) {
        mensaje.textContent = "Primero selecciona una casilla vacía.";
        return;
      }

      seleccionada.textContent = numero || "";

      if (actualizarConflictos()) {
        mensaje.textContent =
          "Ese número se repite en la misma fila, columna o bloque.";
      } else {
        mensaje.textContent = "";
      }
    }

    const teclado = document.getElementById("teclado");

    for (let numero = 1; numero <= 9; numero++) {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.textContent = numero;
      boton.addEventListener("click", () => ponerNumero(numero));
      teclado.appendChild(boton);
    }

    document.getElementById("borrar").addEventListener("click", () => {
      ponerNumero("");
    });

    document.getElementById("reiniciar").addEventListener("click", () => {
      crearTablero();
      mensaje.textContent = "Tablero reiniciado.";
    });

    document.getElementById("nuevo").addEventListener("click", generarSudoku);

    document.getElementById("comprobar").addEventListener("click", () => {
      const celdas = [...document.querySelectorAll(".celda")];
      const hayErrores = actualizarConflictos();
      let completo = true;
      let solucionCorrecta = true;

      celdas.forEach(celda => {
        const fila = Number(celda.dataset.fila);
        const columna = Number(celda.dataset.columna);
        const numero = obtenerNumero(celda);

        if (!numero) completo = false;

        if (numero && numero !== solucion[fila][columna]) {
          solucionCorrecta = false;
        }
      });

      if (hayErrores) {
        mensaje.textContent =
          "Hay números repetidos en una fila, columna o bloque.";
      } else if (!completo) {
        mensaje.textContent = "Aún quedan casillas vacías.";
      } else if (solucionCorrecta) {
        mensaje.textContent = "¡Muy bien! Resolviste el Sudoku.";
      } else {
        mensaje.textContent =
          "No hay repeticiones, pero algunos números no son correctos.";
      }
    });

    generarSudoku();
  </script>
</body>
</html>
